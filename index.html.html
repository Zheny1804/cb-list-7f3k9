<style>
:root{--bg:#f6f3ec;--card:#ffffff;--text:#1c1a17;--muted:#7c7669;--gold:#9a6b14;--gold-bg:#f3e5c3;--line:#e7e1d4;--chip:#efe9dc}
@media (prefers-color-scheme: dark){:root{--bg:#121110;--card:#1d1b18;--text:#f2efe8;--muted:#9b948a;--gold:#d9a441;--gold-bg:#3a2f14;--line:#2c2a26;--chip:#262420}}
html[data-theme="dark"]{--bg:#121110;--card:#1d1b18;--text:#f2efe8;--muted:#9b948a;--gold:#d9a441;--gold-bg:#3a2f14;--line:#2c2a26;--chip:#262420}
html[data-theme="light"]{--bg:#f6f3ec;--card:#ffffff;--text:#1c1a17;--muted:#7c7669;--gold:#9a6b14;--gold-bg:#f3e5c3;--line:#e7e1d4;--chip:#efe9dc}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);
padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 28px) calc(env(safe-area-inset-left,0px) + 16px)}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:'Fraunces',serif;font-size:34px;line-height:1.1;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:22px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tcard .rate{font-size:22px}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{font:inherit;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.owners{margin:0 0 18px;flex-wrap:wrap}
.owners button{font-weight:600}
.owners button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#chips{display:contents}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.chip.off{opacity:.45;text-decoration:line-through}
input[type=search]{flex:1;min-width:160px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
input[type=search]:focus{outline:2px solid var(--gold);border-color:transparent}
.sec{margin:0 0 18px}
.sec h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 10px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.card.best{background:var(--gold-bg);border-color:var(--gold)}
.logo{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:16px}
.meta{flex:1;min-width:0}
.n{font-weight:600;font-size:15px}
.c{color:var(--muted);font-size:12.5px;margin-top:2px}
.rate{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--gold);white-space:nowrap}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11px;font-weight:600}
.bankhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.bankhead .logo{width:44px;height:44px;font-size:18px}
.bankhead .n{font-family:'Fraunces',serif;font-size:19px}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
footer{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}

var on={},tab='cat',q='',owner='ev';
function $(s){return document.querySelector(s)}
function fmt(r){return (r<0?'\u2212'+Math.abs(r):r)+'%'}
function logo(b){return '<span class="logo" style="background:'+S[b].bg+';color:'+S[b].fg+'">'+S[b].s+'</span>'}
function sorted(a){return a.slice().sort(function(x,y){return y.r-x.r})}
function own(d){return d.o||'ev'}
function banksOfOwner(){return Object.keys(S).filter(function(b){return D.some(function(d){return own(d)===owner&&d.b===b})})}
function items(){return D.filter(function(d){return own(d)===owner&&!on[d.b]}).filter(function(d){if(!q)return true;return (d.n+' '+G[d.g]+' '+S[d.b].n).toLowerCase().indexOf(q)>-1})}
function card(d,best,byBank){
 var sub=byBank?G[d.g]:S[d.b].n;
 return '<div class="card'+(best?' best':'')+'">'+logo(d.b)+
 '<div class="meta"><div class="n">'+d.n+(d.p?'<span class="tag">акция</span>':'')+'</div>'+
 '<div class="c">'+sub+(d.t?' · '+d.t:'')+'</div></div>'+
 '<div class="rate">'+fmt(d.r)+'</div></div>';
}
function renderTop(){
 var t=sorted(items().filter(function(d){return !d.p})).slice(0,6);
 $('#top').innerHTML=t.map(function(d){
  return '<div class="tcard"><div class="rate">'+fmt(d.r)+'</div><div class="c">'+d.n+'</div><div class="c">'+S[d.b].n+'</div></div>';
 }).join('');
}
function render(){
 var list=items(),h='';
 if(tab==='cat'){
  G.forEach(function(g,i){
   var arr=sorted(list.filter(function(d){return d.g===i}));
   if(!arr.length)return;
   var bestSet=false;
   h+='<section class="sec"><h2>'+g+'</h2>';
   h+=arr.map(function(d){var best=!d.p&&!bestSet;if(!d.p)bestSet=true;return card(d,best,false)}).join('');
   h+='</section>';
  });
  if(!h)h='<p class="empty">Ничего не найдено.</p>';
 }else{
  banksOfOwner().forEach(function(b){
   if(on[b])return;
   var arr=sorted(list.filter(function(d){return d.b===b}));
   var info=S[b].info[owner]||'';
   h+='<div class="bankhead">'+logo(b)+'<div class="meta"><div class="n">'+S[b].n+'</div>'+(info?'<div class="c">'+info+'</div>':'')+'</div></div>';
   h+=arr.length?arr.map(function(d){return card(d,false,true)}).join(''):'<p class="empty">Ничего не найдено.</p>';
  });
 }
 $('#out').innerHTML=h;
}
function chips(){
 $('#chips').innerHTML=banksOfOwner().map(function(b){
  return '<button type="button" class="chip'+(on[b]?' off':'')+'" data-b="'+b+'">'+S[b].n+'</button>';
 }).join('');
}
function renderAll(){renderTop();render()}
function setOwner(w){
 owner=w;on={};q='';$('#q').value='';
 $('#oEv').classList.toggle('on',w==='ev');
 $('#oAn').classList.toggle('on',w==='an');
 $('#oEl').classList.toggle('on',w==='el');
 chips();renderAll();
}
$('#chips').addEventListener('click',function(e){
 var c=e.target.closest('.chip');if(!c)return;
 var b=c.getAttribute('data-b');on[b]=!on[b];chips();renderAll();
});
$('#q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();renderAll()});
$('#tCat').addEventListener('click',function(){tab='cat';$('#tCat').classList.add('on');$('#tBank').classList.remove('on');render()});
$('#tBank').addEventListener('click',function(){tab='bank';$('#tBank').classList.add('on');$('#tCat').classList.remove('on');render()});
$('#oEv').addEventListener('click',function(){setOwner('ev')});
$('#oAn').addEventListener('click',function(){setOwner('an')});
$('#oEl').addEventListener('click',function(){setOwner('el')});
chips();renderAll();
